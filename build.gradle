import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.moddev
    alias libs.plugins.errorprone
    alias libs.plugins.spotless
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.testFixtures.output
        runtimeClasspath += sourceSets.main.output + sourceSets.testFixtures.output
    }
    datagen {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    main.resources {
        srcDir 'src/generated/resources'
        exclude '.cache'
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    datagenImplementation.extendsFrom implementation
    datagenCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = neo_version

    addModdingDependenciesTo sourceSets.testFixtures
    addModdingDependenciesTo sourceSets.gameTest
    addModdingDependenciesTo sourceSets.datagen

    runs {
        configureEach {
            gameDirectory = project.file("runs/${it.name}")
            sourceSet = sourceSets.gameTest
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            sourceSet = sourceSets.datagen
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
            sourceSet sourceSets.testFixtures
            sourceSet sourceSets.datagen
        }
    }

    unitTest {
        enable()
        testedMod = mods.getByName(mod_id)
    }
}

dependencies {
    compileOnly libs.jspecify
    testFixturesCompileOnly libs.jspecify

    testFixturesApi libs.datafaker

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testImplementation "net.neoforged:testframework:${neo_version}"

    gameTestImplementation libs.datafaker
    additionalRuntimeClasspath libs.datafaker

    errorprone libs.errorprone.core
    errorprone libs.nullaway
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.errorprone {
        check('NullAway', CheckSeverity.ERROR)
        option('NullAway:OnlyNullMarked', 'true')
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat(libs.versions.palantir.java.format.get())
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
